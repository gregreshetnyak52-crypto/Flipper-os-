name: Build FlipperOS firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release: tag to create on this commit (e.g. v1.3). Empty = build only."
        required: false
        default: ""

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to find new release notes

      # A push to main that adds or edits docs/releases/<tag>.md releases
      # <tag>, unless that tag already exists
      - name: Find release notes in this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          for notes in $(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'docs/releases/v*.md'); do
            tag="$(basename "$notes" .md)"
            if [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Releasing $tag"
              echo "NOTES_TAG=$tag" >> "$GITHUB_ENV"
            fi
          done

      - name: Set version suffix
        env:
          INPUT_TAG: ${{ inputs.release_tag || env.NOTES_TAG }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "release_tag must look like v1.3" >&2
              exit 1
            fi
            echo "RELEASE_TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "DIST_SUFFIX=flipperos-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [[ -n "$INPUT_TAG" ]]; then
            echo "DIST_SUFFIX=flipperos-${INPUT_TAG}" >> "$GITHUB_ENV"
          else
            echo "DIST_SUFFIX=flipperos-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      # Like Unleashed: the plain package carries the base app pack, the "e"
      # package base + extra. Same firmware, the packs are SD card resources.
      - name: Build updater package
        run: firmware/build.sh

      - name: Build updater package with the extra app pack
        env:
          DIST_SUFFIX: ${{ env.DIST_SUFFIX }}e
          FLIPPEROS_PACK: extra
        run: firmware/build.sh

      - name: Verify the packages contain the app packs
        run: |
          python3 -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/pip" install --quiet heatshrink2
          check="$RUNNER_TEMP/check/bin/python firmware/tools/check_package.py"
          dist=firmware/unleashed/dist/f7-C
          cache=firmware/.cache
          $check "$dist/flipper-z-f7-update-${DIST_SUFFIX}.tgz" \
            --pack "$cache/all-the-apps-base.tgz"
          $check "$dist/flipper-z-f7-update-${DIST_SUFFIX}e.tgz" \
            --pack "$cache/all-the-apps-base.tgz" --pack "$cache/all-the-apps-extra.tgz"

      - name: Collect apps
        run: |
          mkdir -p release-apps
          cp firmware/unleashed/build/f7-firmware-C/.extapps/patrol.fap release-apps/ || true
          cp companion/patrol-report.html release-apps/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_SUFFIX }}
          path: |
            firmware/unleashed/dist/f7-C/flipper-z-f7-update-*.tgz
            firmware/unleashed/dist/f7-C/flipper-z-f7-full-${{ env.DIST_SUFFIX }}.dfu
            release-apps/*

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          # Created on the built commit when it does not exist yet
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: FlipperOS ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          files: |
            firmware/unleashed/dist/f7-C/flipper-z-f7-update-*.tgz
            firmware/unleashed/dist/f7-C/flipper-z-f7-full-${{ env.DIST_SUFFIX }}.dfu
            release-apps/*
